<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard App</title>
  <!-- 1. CHART.JS LIBRARY (REQUIRED) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .hidden { display: none; }
    #nav { display: flex; gap: 10px; margin-bottom: 20px; }
    #tabsWrapper { overflow: hidden; }
    #tabs { display: flex; transition: transform 0.3s ease; }
    .tab-content { min-width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login">
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="App.login()">Login</button>
  </div>

  <!-- NAVIGATION -->
  <div id="nav" class="hidden">
    <button onclick="App.switchTab(0, this)">Home</button>
    <button onclick="App.switchTab(1, this)">Analytics</button>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="app" class="hidden">
    
    <!-- DATE RANGE SELECTOR -->
    <div>
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button onclick="App.applyRange()">Apply Range</button>
      <button onclick="App.setRange('today')">Today</button>
      <button onclick="App.setRange('7')">7 Days</button>
      <button onclick="App.setRange('30')">30 Days</button>
    </div>

    <!-- TABS SLIDER CONTAINER -->
    <div id="tabsWrapper">
      <div id="tabs">
        
        <!-- TAB 0: HOME -->
        <div class="tab-content">
          <div>Sales: <span id="sales">£0.00</span></div>
          <div>Products: <span id="products">0</span></div>
          <div>Top Item: <span id="top">-</span></div>

          <div id="homeTopList"></div>
          <canvas id="barChart"></canvas>
        </div>

        <!-- TAB 1: ANALYTICS -->
        <div class="tab-content">
          <table border="1">
            <thead><tr><th>Product</th><th>Revenue</th></tr></thead>
            <tbody id="productTable"></tbody>
          </table>
          <canvas id="salesChart"></canvas>
          <div id="insights"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- NOTIFICATION & LOADER -->
  <div id="loading" class="hidden">Loading data...</div>
  <div id="toast"></div>

  <!-- YOUR JS CODE HERE -->
  <script src="app.js"></script>
</body>
</html>
