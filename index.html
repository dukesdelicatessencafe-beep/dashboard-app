<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales & Analytics Dashboard</title>
  
  <!-- CHART.JS LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --primary-gold: #D4AF37;
      --accent-gold: #F9E3B4;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-light: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
    }

    .hidden { display: none !important; }

    /* Login Form */
    #login {
      max-width: 320px;
      margin: 100px auto;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--primary-gold);
      border-radius: 8px;
      text-align: center;
    }

    #login input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid var(--primary-gold);
      color: #fff;
      border-radius: 4px;
    }

    button {
      background: var(--primary-gold);
      color: #000;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-gold);
    }

    /* Navigation */
    #nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* KPI Cards Header */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-left: 4px solid var(--primary-gold);
      padding: 15px;
      border-radius: 4px;
    }

    .kpi-card h3 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: var(--accent-gold);
    }

    .kpi-card .val {
      font-size: 22px;
      font-weight: bold;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .controls input[type="date"] {
      background: #2a2a2a;
      border: 1px solid var(--primary-gold);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
    }

    /* Tabs Slider */
    #tabsWrapper {
      overflow: hidden;
      width: 100%;
    }

    #tabs {
      display: flex;
      transition: transform 0.3s ease;
      width: 200%;
    }

    .tab-content {
      width: 50%;
      box-sizing: border-box;
      padding-right: 20px;
    }

    /* Tables & Charts */
    .chart-container {
      position: relative;
      height: 380px;
      width: 100%;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      margin-bottom: 20px;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    table th {
      color: var(--accent-gold);
    }

    /* Notification & Loader */
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: var(--accent-gold);
      z-index: 1000;
    }

    #toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--primary-gold);
      color: #000;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: bold;
      display: none;
      z-index: 1001;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login">
    <h2 style="color: var(--primary-gold);">Dashboard Login</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button onclick="App.login()">Login</button>
  </div>

  <!-- NAVIGATION -->
  <div id="nav" class="hidden">
    <button onclick="App.switchTab(0)">Overview</button>
    <button onclick="App.switchTab(1)">Analytics</button>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="app" class="hidden">
    
    <!-- KPI SUMMARY HEADER -->
    <div class="kpi-row">
      <div class="kpi-card">
        <h3>TOTAL SALES</h3>
        <div class="val" id="sales">£0.00</div>
      </div>
      <div class="kpi-card">
        <h3>ACTIVE DAYS / RECORDS</h3>
        <div class="val" id="products">0</div>
      </div>
      <div class="kpi-card">
        <h3>TOP CATEGORY</h3>
        <div class="val" id="top">-</div>
      </div>
    </div>

    <!-- DATE RANGE SELECTOR CONTROLS -->
    <div class="controls">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button onclick="App.applyRange()">Apply Range</button>
      <button onclick="App.setRange('today')">Today</button>
      <button onclick="App.setRange('7')">7 Days</button>
      <button onclick="App.setRange('31')">31 Days</button>
    </div>

    <!-- TABS SLIDER CONTAINER -->
    <div id="tabsWrapper">
      <div id="tabs">
        
        <!-- TAB 0: OVERVIEW -->
        <div class="tab-content">
          <div class="chart-container">
            <canvas id="barChart"></canvas>
          </div>
        </div>

        <!-- TAB 1: ANALYTICS -->
        <div class="tab-content">
          <div class="chart-container">
            <canvas id="salesChart"></canvas>
          </div>
          <table>
            <thead>
              <tr>
                <th>Date / Entry</th>
                <th>Daily Revenue</th>
              </tr>
            </thead>
            <tbody id="productTable"></tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <!-- LOADER & TOAST -->
  <div id="loading" class="hidden">Loading dashboard data...</div>
  <div id="toast"></div>

  <!-- APP LOGIC ENGINE -->
  <script>
    const CONFIG = {
      URL: "https://script.google.com/macros/s/AKfycbwnCqt1dwhjcQNSrDRygzUprIT18kGY34KpauYXuW7MA-lrB4mNUcy6C1WoQ6i-dkq4cQ/exec",
      PASSWORD: "1234"
    };

    const STATE = {
      raw: [],
      barChart: null,
      salesChart: null
    };

    const $ = (id) => document.getElementById(id);

    const safeSet = (id, text) => {
      const el = $(id);
      if (el) el.innerText = text;
    };

    const fmt = (cents) => "£" + (Math.round(cents) / 100).toFixed(2);

    const toast = (msg) => {
      const t = $("toast");
      if (!t) return;
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    };

    const cleanCents = (val) => {
      if (val === null || val === undefined || val === "") return 0;
      const cleanStr = String(val).replace(/[^0-9.-]+/g, "");
      if (!cleanStr) return 0;
      
      const parts = cleanStr.split('.');
      let cents = 0;
      
      if (parts[0]) {
        cents += parseInt(parts[0], 10) * 100;
      }
      if (parts[1]) {
        let dec = parts[1].padEnd(2, '0').slice(0, 2);
        cents += parseInt(dec, 10);
      }
      
      return isNaN(cents) ? 0 : cents;
    };

    const parseDateString = (dateStr) => {
      if (!dateStr) return null;

      let y, m, d;

      if (typeof dateStr === "number" || (!isNaN(dateStr) && String(dateStr).trim() !== "")) {
        const serial = parseFloat(dateStr);
        const utcDays = Math.floor(serial - 25569);
        const utcValue = utcDays * 86400 * 1000;
        const tempD = new Date(utcValue);
        if (isNaN(tempD.getTime())) return null;
        y = tempD.getUTCFullYear();
        m = tempD.getUTCMonth() + 1;
        d = tempD.getUTCDate();
      } else {
        const str = String(dateStr).trim();
        const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (isoMatch) {
          y = parseInt(isoMatch[1], 10);
          m = parseInt(isoMatch[2], 10);
          d = parseInt(isoMatch[3], 10);
        } else {
          const ukMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
          if (ukMatch) {
            d = parseInt(ukMatch[1], 10);
            m = parseInt(ukMatch[2], 10);
            y = parseInt(ukMatch[3], 10);
          } else {
            const tempD = new Date(str);
            if (isNaN(tempD.getTime())) return null;
            y = tempD.getFullYear();
            m = tempD.getMonth() + 1;
            d = tempD.getDate();
          }
        }
      }

      const dateInt = y * 10000 + m * 100 + d;
      const dateObj = new Date(y, m - 1, d);

      return { year: y, month: m, day: d, dateInt, dateObj };
    };

    function processRows(rows) {
      if (!rows || !Array.isArray(rows) || rows.length === 0) return [];

      const headerRow = rows.find(r => r && r[1] && String(r[1]).toLowerCase().includes("date")) || rows[0] || [];

      const getColIndex = (name) => {
        return headerRow.findIndex(cell => 
          cell && String(cell).toLowerCase().trim().includes(name.toLowerCase())
        );
      };

      const idxTotal   = getColIndex("total") !== -1 ? getColIndex("total") : -1;
      const idxIceCream = getColIndex("ice cream") !== -1 ? getColIndex("ice cream") : 4;
      const idxCounter  = getColIndex("counter") !== -1 ? getColIndex("counter") : 5;
      const idxKitchen  = getColIndex("kitchen") !== -1 
        ? getColIndex("kitchen") 
        : (getColIndex("food") !== -1 ? getColIndex("food") : 6);
      const idxDrink    = getColIndex("drink") !== -1 ? getColIndex("drink") : 7;
      const idxDeli     = getColIndex("deli") !== -1 ? getColIndex("deli") : 8;
      const idxAlcohol  = getColIndex("alcohol") !== -1 ? getColIndex("alcohol") : 9;

      const parsedRecords = [];

      rows.forEach(row => {
        if (!row || !Array.isArray(row)) return;

        const dayName = row[0] ? String(row[0]).trim() : "";
        const rawDate = row[1];
        const cashVal = row[2];
        const cardVal = row[3];

        if (!rawDate || String(dayName).toLowerCase().includes("month total") || String(rawDate).toLowerCase().includes("date")) {
          return;
        }

        const cashCents = cleanCents(cashVal);
        const cardCents = cleanCents(cardVal);
        
        let dailyTotalCents = (idxTotal !== -1 && row[idxTotal] !== undefined && row[idxTotal] !== "") 
          ? cleanCents(row[idxTotal]) 
          : (cashCents + cardCents);

        const parsedDateInfo = parseDateString(rawDate);
        if (!parsedDateInfo && !dayName && dailyTotalCents === 0) return;
        if (dailyTotalCents === 0 && !dayName) return;

        parsedRecords.push({
          dayName,
          rawDate,
          parsedDate: parsedDateInfo ? parsedDateInfo.dateObj : null,
          dateInt: parsedDateInfo ? parsedDateInfo.dateInt : 0,
          cashCents,
          cardCents,
          dailyTotalCents,
          categories: {
            "ICE CREAM": cleanCents(row[idxIceCream]),
            "COUNTER": cleanCents(row[idxCounter]),
            "Kitchen": cleanCents(row[idxKitchen]),
            "DRINK": cleanCents(row[idxDrink]),
            "DELI": cleanCents(row[idxDeli]),
            "ALCOHOL": cleanCents(row[idxAlcohol])
          }
        });
      });

      return parsedRecords;
    }

    function renderDashboard(records) {
      const container = $("productTable");
      let totalRevCents = 0;
      let totalCashCents = 0;
      let totalCardCents = 0;
      const categoryTotalsCents = {
        "ICE CREAM": 0,
        "COUNTER": 0,
        "Kitchen": 0,
        "DRINK": 0,
        "DELI": 0,
        "ALCOHOL": 0
      };

      if (container) container.innerHTML = "";

      records.forEach(rec => {
        totalRevCents += rec.dailyTotalCents;
        totalCashCents += rec.cashCents;
        totalCardCents += rec.cardCents;

        Object.keys(rec.categories).forEach(cat => {
          categoryTotalsCents[cat] += rec.categories[cat];
        });

        if (container) {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${rec.dayName} ${rec.parsedDate ? rec.parsedDate.toLocaleDateString("en-GB") : String(rec.rawDate)}</td>
            <td>${fmt(rec.dailyTotalCents)}</td>
          `;
          container.appendChild(tr);
        }
      });

      safeSet("sales", fmt(totalRevCents));
      safeSet("products", records.length);

      let topCat = "-";
      let maxRevCents = -1;
      Object.entries(categoryTotalsCents).forEach(([cat, val]) => {
        if (val > maxRevCents && val > 0) {
          maxRevCents = val;
          topCat = `${cat} (${fmt(val)})`;
        }
      });
      safeSet("top", topCat);

      renderBarChart(records);
      renderSalesChart(records);
    }

    function renderBarChart(records) {
      const canvas = $("barChart");
      if (!canvas || typeof Chart === "undefined") return;

      if (STATE.barChart) STATE.barChart.destroy();

      // Force up to 31 records slice here
      const recentRecords = records.slice(-31);
      const labels = recentRecords.map(r => r.dayName || (r.parsedDate ? r.parsedDate.toLocaleDateString("en-GB") : String(r.rawDate)));
      const data = recentRecords.map(r => r.dailyTotalCents / 100);

      STATE.barChart = new Chart(canvas, {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Daily Revenue (£)",
            data,
            backgroundColor: "#D4AF37"
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 }
            }
          }
        }
      });
    }

    function renderSalesChart(records) {
      const canvas = $("salesChart");
      if (!canvas || typeof Chart === "undefined") return;

      if (STATE.salesChart) STATE.salesChart.destroy();

      const recentRecords = records.slice(-31);
      const labels = recentRecords.map(r => r.parsedDate ? r.parsedDate.toLocaleDateString("en-GB") : String(r.rawDate));
      const data = recentRecords.map(r => r.dailyTotalCents / 100);

      STATE.salesChart = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Sales Trend (31 Days)",
            data,
            borderColor: "#D4AF37",
            backgroundColor: "rgba(212, 175, 55, 0.1)",
            fill: true
          }]
        },
        options: { 
          responsive: true, 
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 }
            }
          }
        }
      });
    }

    const load = async () => {
      try {
        const loader = $("loading");
        if (loader) loader.classList.remove("hidden");

        const res = await fetch(CONFIG.URL, { cache: "no-store" });
        const json = await res.json();

        let allRecords = [];

        if (json && json.tabs) {
          Object.values(json.tabs).forEach(tabRows => {
            const processed = processRows(tabRows);
            allRecords = allRecords.concat(processed);
          });
        } else if (json && json.rows && Array.isArray(json.rows)) {
          allRecords = processRows(json.rows);
        } else if (Array.isArray(json)) {
          allRecords = processRows(json);
        }

        STATE.raw = allRecords;
        renderDashboard(STATE.raw);
        toast("All tabs loaded successfully");
      } catch (e) {
        console.error("Fetch error:", e);
        toast("Failed to load spreadsheet data");
      } finally {
        const loader = $("loading");
        if (loader) loader.classList.add("hidden");
      }
    };

    const applyRange = () => {
      const startVal = $("startDate")?.value;
      const endVal = $("endDate")?.value;

      if (!startVal || !endVal) {
        renderDashboard(STATE.raw);
        return;
      }

      const [sY, sM, sD] = startVal.split("-").map(Number);
      const [eY, eM, eD] = endVal.split("-").map(Number);

      const startInt = sY * 10000 + sM * 100 + sD;
      const endInt = eY * 10000 + eM * 100 + eD;

      const filtered = STATE.raw.filter(r => {
        if (!r.dateInt) return true;
        return r.dateInt >= startInt && r.dateInt <= endInt;
      });

      renderDashboard(filtered);
    };

    const setRange = (type) => {
      const now = new Date();
      let start = new Date();

      if (type === "today") {
        start = now;
      } else if (type === "7") {
        start.setDate(now.getDate() - 7);
      } else if (type === "31") {
        start.setDate(now.getDate() - 31);
      }

      if ($("startDate")) $("startDate").value = start.toISOString().split("T")[0];
      if ($("endDate")) $("endDate").value = now.toISOString().split("T")[0];

      applyRange();
    };

    const login = () => {
      const pwd = $("pass")?.value;
      if (pwd === CONFIG.PASSWORD) {
        $("login")?.classList.add("hidden");
        $("app")?.classList.remove("hidden");
        $("nav")?.classList.remove("hidden");
        load();
      } else {
        toast("Invalid password");
      }
    };

    const switchTab = (idx) => {
      const tabs = $("tabs");
      if (tabs) tabs.style.transform = `translateX(-${idx * 50}%)`;
    };

    window.App = {
      login,
      load,
      setRange,
      applyRange,
      switchTab
    };
  </script>
</body>
</html>
