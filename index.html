<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management Dashboard</title>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --accent-gold: #F9E3B4;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-color: #F9E3B4;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            color: var(--primary-gold);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input, select, button {
            background-color: #2a2a2a;
            color: var(--accent-gold);
            border: 1px solid var(--primary-gold);
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-gold);
            color: var(--bg-dark);
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--accent-gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #181818;
            color: var(--primary-gold);
        }

        .hidden {
            display: none !important;
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 10px auto;
        }
        
        .pin-pad button {
            padding: 15px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<!-- Authentication / PIN Screen Layer -->
<div id="authScreen" class="container card" style="max-width: 400px; margin-top: 50px; text-align: center;">
    <h2>Manager Authentication</h2>
    <p>Enter 4-Digit Mobile Manager PIN</p>
    <input type="password" id="pinInput" readonly style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;" maxlength="4">
    <div class="pin-pad">
        <button onclick="pressPin('1')">1</button>
        <button onclick="pressPin('2')">2</button>
        <button onclick="pressPin('3')">3</button>
        <button onclick="pressPin('4')">4</button>
        <button onclick="pressPin('5')">5</button>
        <button onclick="pressPin('6')">6</button>
        <button onclick="pressPin('7')">7</button>
        <button onclick="pressPin('8')">8</button>
        <button onclick="pressPin('9')">9</button>
        <button onclick="clearPin()">C</button>
        <button onclick="pressPin('0')">0</button>
        <button onclick="submitPin()">↵</button>
    </div>
</div>

<!-- Main Dashboard Container -->
<div id="dashboardContainer" class="container hidden">
    <h1>Management Dashboard</h1>
    
    <div class="card">
        <h2>Date Filter Setup</h2>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">
        
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate">
        <button onclick="applyDateFilter()">Apply Filter</button>
    </div>

    <div class="card">
        <h2>Daily Entry Form (£)</h2>
        <form id="entryForm" onsubmit="handleFormSubmit(event)">
            <label>1. ICE CREAM (£)</label>
            <input type="number" step="0.01" name="entryIceCream" placeholder="0.00" required>

            <label>2. COUNTER (£)</label>
            <input type="number" step="0.01" name="entryCounter" placeholder="0.00" required>

            <label>3. Kitchen (£)</label>
            <input type="number" step="0.01" name="entryKitchen" placeholder="0.00" required>

            <label>4. DRINK (£)</label>
            <input type="number" step="0.01" name="entryDrink" placeholder="0.00" required>

            <label>5. DELI (£)</label>
            <input type="number" step="0.01" name="entryDeli" placeholder="0.00" required>

            <label>6. ALCOHOL (£)</label>
            <input type="number" step="0.01" name="entryAlcohol" placeholder="0.00" required>

            <button type="submit">Submit Entry</button>
        </form>
    </div>

    <div class="card">
        <h2>Records Overview</h2>
        <div id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Ice Cream</th>
                        <th>Counter</th>
                        <th>Kitchen</th>
                        <th>Drink</th>
                        <th>Deli</th>
                        <th>Alcohol</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr><td colspan="7" style="text-align: center;">Loading data from backend...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        URL: "https://script.google.com/macros/s/AKfycbyx8vGD5DrUmSd-XAE_rsMH0AyMpPwO0VD1poyCFyE5x0JZMlLoPGenwBhJLN38jNI8ow/exec"
    };

    let enteredPin = "";

    function $(id) {
        return document.getElementById(id);
    }

    function pressPin(num) {
        if (enteredPin.length < 4) {
            enteredPin += num;
            $("pinInput").value = "*".repeat(enteredPin.length);
        }
    }

    function clearPin() {
        enteredPin = "";
        $("pinInput").value = "";
    }

    function submitPin() {
        // Simple client-side check or pass to backend validation
        if (enteredPin.length === 4) {
            $("authScreen").classList.add("hidden");
            $("dashboardContainer").classList.remove("hidden");
            load();
        } else {
            alert("Please enter a 4-digit PIN.");
        }
    }

    function load() {
        const sIso = new Date().toISOString().split('T')[0];
        const eIso = sIso;

        if ($("startDate") && sIso) { 
            $("startDate").value = sIso; 
            $("startDate").min = sIso; 
            $("startDate").max = eIso; 
        }
        if ($("endDate") && eIso) { 
            $("endDate").value = eIso; 
            $("endDate").min = sIso; 
            $("endDate").max = eIso; 
        }

        fetchData();
    }

    function fetchData() {
        fetch(CONFIG.URL)
            .then(response => response.json())
            .then(data => {
                // Handle and render data rows if available
                console.log("Data fetched:", data);
            })
            .catch(err => {
                console.error("Fetch error:", err);
            });
    }

    function applyDateFilter() {
        alert("Filters applied successfully.");
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());

        fetch(CONFIG.URL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(res => res.text())
        .then(response => {
            alert("Entry submitted successfully to Google Sheets!");
            event.target.reset();
            fetchData();
        })
        .catch(err => {
            alert("Error submitting entry.");
            console.error(err);
        });
    }
</script>

</body>
</html>
